<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .cart{
      margin:50px auto;
      background-color: olivedrab;
      height: 300px;
      width: 300px;
      box-shadow: 0px 0px 10px 10px rgb(162, 221, 155);
      border-radius: 5px;
      border: 3px dashed rgb(3, 56, 17);
      padding: 10px;
    }

    .title{
      text-align: center;
      font-size: 30px;
      font-family:Tahoma, Geneva, Verdana, sans-serif;
      text-shadow: 2px 2px 5px rgb(3, 56, 17);
      text-decoration: underline;
    }

    .item{
      display: flex;
      justify-content: space-between;
      margin: 20px 40px;
      font-size: 18px;
      font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
      font-weight: bold;
    }

    .btn{
      margin-top: 20px;
      padding: 8px 20px;
      background-color: rgb(123, 230, 77);
      color: rgb(3, 56, 17);
      border: none;
      border-radius: 5px;
      font-size: 15px;
      font-family: Tahoma, Geneva, Verdana, sans-serif;
      font-weight: bold;
      display: block;
      margin-left: auto;
      margin-right: auto;
      cursor: pointer;

    }

    .btn:hover{
      background-color: rgb(3, 56, 17);
      color: rgb(123, 230, 77);
    }

  </style>
</head>
<body>
  <div class="cart">
    <h2 class="title">Online Shop</h2>
     <div class="item">
      <span>Tea:</span>
      <span>₹50</span>
    </div>
    <div class="item">
      <span>Coffee:</span>
      <span>₹100</span>
    </div>
    <div class="item">
      <span>Aata:</span>
      <span>₹80</span>
    </div>
    <div class="item">
      <span>Chini:</span>
      <span>₹100</span>
    </div>
    <button class="btn">Buy Now</button>
  </div>
</body>
</html>
