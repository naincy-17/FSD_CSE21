<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="bus">
        <div class="title">
            <img src="img1.jpg" class="image" alt="">
            <h3>Bus Booking System</h3>
        </div>
        <div class="user-info-box">
            <p class="user-info-label">User Information</p>
        </div>
        <div class="user-info">
            <div class="user-info-value">
                <label for="name">User Name:</label>
                <input type="text" id="name" name="name">
            </div>
            <div class="user-info-value">
                <label for="age">User Age:</label>
                <input type="number" id="age" name="age">
            </div>
            <div class="user-info-value">
                <label for="Aadhar">User Aadhar no:</label>
                <input type="text" id="Aadhar" name="Aadhar">
            </div>
            <div class="user-info-value">
                <label for="city">Select City:</label>
                <select id="city" name="city">
                    <option value="city1">Mumbai</option>
                    <option value="city2">Kolkata</option>
                    <option value="city3">Delhi</option>
                    <option value="city4">Chennai</option>
                </select>
            </div>
            <div class="user-info-value">
                <label for="Journey date">Journey Date:</label>
                <input type="date" id="Journey date" name="Journey date">
            </div>
        </div>
        <div class="user-info-box">
            <p class="user-info-label">Bus Information</p>
        </div>
        <div class="user-info-value">
            <div>
                <input type="radio" id="bus1" name="bus" value="bus1">
                <label for="bus1">AC Bus Rs. 2000</label>
            </div>
            <div>
                <input type="radio" id="bus2" name="bus" value="bus2">
                <label for="bus2">Non-AC Bus Rs. 1000</label>
            </div>
            <div class="user-info-value">
                <label for="seats">Number of Seats:</label>
                <select type="number" id="seats" name="seats">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>
            <button type="submit" class="submit-button">Book Bus</button>
    </div>
    </div>
    <script>
        function bookBus(user, bus, fare) {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    if (user && bus && fare) {
                        resolve({ user, bus, fare });
                    } else {
                        reject("Booking failed: Missing info");
                    }
                }, 1000); 
            });
        }

        document.getElementById("bookBtn").addEventListener("click", () => {
            const userName = document.getElementById("name").value;
            const busOption = document.querySelector('input[name="bus"]:checked');
            const seats = parseInt(document.getElementById("seats").value);

            if (!userName || !busOption) {
                document.getElementById("confirmation-block").innerHTML =
                    `<p style="color:red;">Please enter your name and select a bus.</p>`;
                return;
            }

            let busSelected = busOption.value;
            let fare = busSelected.includes("AC") ? 2000 : 1000;
            let totalFare = fare * seats;

            bookBus(userName, busSelected, totalFare)
                .then(result => {
                    document.getElementById("confirmation-block").innerHTML =
                        `<h3>Booking Confirmed</h3>
                         <p>User: ${result.user}</p>
                         <p>Bus Selected: ${result.bus}</p>
                         <p>Total Fare: ₹${result.fare}</p>`;
                })
                .catch(error => {
                    document.getElementById("confirmation-block").innerHTML =
                        `<p style="color:red;">${error}</p>`;
                });
        });
    </script>
</body>

</html>
