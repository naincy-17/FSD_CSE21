<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY SHOP</title>
  <style>
    .container {
      display: grid;
      grid-template-columns: repeat(3,1fr); 
      gap: 20px;
      width: 90%;
      margin: auto;
    }
    .card {
      border: 2px solid rgb(51, 155, 220);
      border-radius: 8px;
      text-align: center;
      padding: 10px;
      font-size: 18px;
      color: rgb(36, 113, 201);
     
    }
    .card img {
      width: 100%;
      height: 650px;
      object-fit: cover;
      border-radius: 5px;
    }
    .card h3 {
      margin: 10px 0;
    }
    .card p {
      font-weight: bold;
    }
    /* .cart-btn {
      margin-top: 10px;
      padding: 8px 12px;
      background: rgb(36, 113, 201);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    } */
    /* .cart-btn:hover {
      background: rgb(25, 82, 150);
    } */
  </style>
</head>
<body>
  <h2 style="text-align:center; color:rgb(36,113,201)">🛒 My Shop</h2>
  <div class="container" id="data"></div>

  <script>
    const ele = document.getElementById("data");
    const URL = "https://dummyjson.com/products";

    async function loadProduct(){
      try {
        const res = await fetch(URL);
        const data = await res.json();
        console.log("DATA:", data.products);

        let cards = "";
        data.products.forEach((item) => {
          cards += `
            <div class="card">
              <img src="${item.images[0]}" alt="${item.title}">
              <h3>${item.title}</h3>
              <p>Price: Rs. ${item.price}</p>
            </div>
          `;
        });
        ele.innerHTML = cards;
      } catch (err) {
        console.log("ERROR", err);
      }
    }
    loadProduct();
  </script>
</body>
</html>
