<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY SHOP</title>
    <style>
        img{
            height: 100px;
            width: 200px;
        }
        table{
            width:80%;
            margin:auto;
            padding: 10px;
            font-size: 25px;
            color: rgb(36, 113, 201);
            border: 2px solid rgb(51, 155, 220);
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>sr.no</th>
                <th>Title</th>
                <th>Image</th>
                <th>Category</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody id="data">

        </tbody>
    </table>
    <script>
        const ele = document.getElementById("data");
        const URL = "https://dummyjson.com/products";

        async function loadProduct(){
            try{
                const res = await fetch(URL);
                const data = await res.json();
                console.log("DATA:",data.products);
                let row = "";
                data.products.map((i,index)=>{
                    row += `
                    <tr>
                        <td>${index+1}</td>
                        <td>${i.title}</td>
                        <td><img src =${i.images[0] }></td>
                        <td>${i.cateogry}</td>
                        <td>${i.price}</td>
                        </tr>
                    `;
                    ele.innerHTML = row;

                })

            }
            catch (err){ 
                console.log("ERROR",err)
            }
        }
        loadProduct();
    </script>
</body>
</html>
